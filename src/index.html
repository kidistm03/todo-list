<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Todo List</title>
    </head>
<body>

    <header class="header">
        <div class="header-left">
            <button id="menu-toggle" aria-label="Toggle Menu">☰</button>
            <div class="logo">
                <span class="logo-icon">✅</span>
                <h1>WhatToDo</h1>
            </div>
        </div>
        <div class="header-right">
            <label class="theme-switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider round"></span>
            </label>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <section class="nav-section">
                <h2>Home</h2>
                <ul id="default-categories">
                    <li data-category="all" class="active">📂 All Tasks</li>
                    <li data-category="today">📅 Today</li>
                    <li data-category="week">🗓️ Next 7 Days</li>
                    <li data-category="important">⭐ Important</li>
                </ul>
            </section>

            <hr>
            <section class="projects-section">
                <h2>Projects</h2>
                <ul id="project-list"></ul>

                <button id="add-project-btn" class="text-btn">+ Add Project</button>
                
                <div id="new-project-form" class="hidden">
                    <input type="text" id="new-project-name" placeholder="Project name..." />
                    <div class="form-actions">
                        <button id="save-project-btn">Add</button>
                        <button id="cancel-project-btn">Cancel</button>
                    </div>
                </div>
            </section>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h2 id="current-project-title">All Tasks</h2>
                <button id="add-todo-btn" class="primary-btn">+ Add Task</button>
            </header>

            <div id="todo-list-container">
                </div>

            <dialog id="todo-modal">
                <form id="todo-form" method="dialog">
                    <h3 id="form-title">New Task</h3>
                    
                    <div class="input-group">
                        <label for="todo-title">Title *</label>
                        <input type="text" id="todo-title" required />
                    </div>

                    <div class="input-group">
                        <label for="todo-desc">Description</label>
                        <textarea id="todo-desc"></textarea>
                    </div>

                    <div class="input-row">
                        <div class="input-group">
                            <label for="todo-date">Due Date *</label>
                            <input type="date" id="todo-date" required />
                        </div>
                        <div class="input-group">
                            <label for="todo-priority">Priority</label>
                            <select id="todo-priority">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" id="save-todo-btn">Save</button>
                        <button type="button" id="cancel-todo-btn">Cancel</button>
                    </div>
                </form>
            </dialog>
        </main>
    </div>

</body>
</html>
